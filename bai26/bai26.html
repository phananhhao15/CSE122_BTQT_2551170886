<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container my-5">
      <div class="car shadow mx-auto the">
        <div class="card-header bg-success text-white text-center">
          <h4 class="mb-0">Dang ky CLB lap trinh web</h4>
        </div>
        <div class="card-body p-4">
          <form
            class="row g-3"
            onsubmit="
              event.preventDefault();
              alert('Dang ky thanh cong!');
            "
          >
            <div class="col-md-6">
              <label for="hoten" class="form-label"> Họ và tên</label>
              <input type="text" class="form-control" id="hoten" required />
            </div>

            <div class="col-md-6">
              <label for="masv" class="form-label">Mã sinh viên</label>
              <input type="text" class="form-control" id="masv" required />
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required />
            </div>
            <div class="col-md-6">
              <label for="sdt" class="form-label">Số điện thoại</label>
              <input
                type="tel"
                class="form-control"
                id="sdt"
                pattern="[0-9]{9,11}"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="form-label d-block">Trình độ</label>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="trinhdo"
                  id="td1"
                  value="co-ban"
                  required
                />
                <label for="" class="form-check-label" for="td1">Cơ bản</label>
              </div>
              <div class="form-check form-check-inline">
                <input
                  class="form-check-input"
                  type="radio"
                  name="trinhdo"
                  id="td2"
                  value="kha"
                />
                <label class="form-check-label" for="td2">Khá</label>
              </div>
              <div class="form-check form-check-inline">

                <input
                  class="form-check-input"
                  type="radio"
                  name="trinhdo"
                  id="td3"
                  value="tot"
                />
                <label class="form-check-label" for="td3">Tốt</label>
            </div>
            <div class="col-md-6">
              <label for="lop" class="form-label">Chọn lớp</label>
              <select class="form-select" id="lop" required>
                <option value="">-- Chọn lớp --</option>
                <option >CSE01</option>
                <option >CSE02</option>
              </select>
            </div>
            <div class="col-12">
              <dv class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="camket"
                  required
                />
                <label class="form-check-label" for=camket>
                  Tôi cam kết thông tin là chính xác 
                </label>
              </dv>
            </div>
            <div class="col-12 d-grid gap-2 d-md-flex justify-content-md-end">
              <button type="reset" class="btn btn-outline-secondary">Nhập lại</button>
              <button type="submit" class="btn btn-success">
                Đăng ký
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
