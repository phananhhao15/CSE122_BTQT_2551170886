<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng điều khiển - CSE TLU Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="bai30.css" />
  </head>
  <body>
    <div class="khung">
      <aside class="slide">
        <h6 class="px-3 py-3 mb-0 fw-bold border-bottom border-secondary">
          CSE&gt;TLU Admin
        </h6>
        <ul class="nav nav-pills flex-column p-2 gap-1">
          <li class="nav-item">
            <a href="#" class="nav-link active">Bảng điều khiển</a>
          </li>
          <li class="nav-item"><a href="#" class="nav-link">Bài tập</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Sinh viên</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Điểm số</a></li>
        </ul>
      </aside>
      <main class="noiDung p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h4 mb-0">Bảng điều khiển</h1>
          <div class="d-flex align-items-center gap-2">
            <span class="badge text-bg-warning">3 bài mới</span>
            <button type="button" class="btn btn-primary btn-sm">
              Xuất báo cáo
            </button>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <div class="text-muted small">Sinh viên</div>
                <div class="fs-2 fw-bold">128</div>
                <div class="progress mt-2">
                  <div class="progress-bar bg-primary" style="width: 80%"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <div class="text-muted small">Đã nộp</div>
                <div class="fs-2 fw-bold">96</div>
                <div class="progress mt-2">
                  <div class="progress-bar bg-success" style="width: 75%"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <div class="text-muted small">Chưa nộp</div>
                <div class="fs-2 fw-bold">32</div>
                <div class="progress mt-2">
                  <div class="progress-bar bg-danger" style="width: 25%"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <div class="text-muted small">Điểm TB</div>
                <div class="fs-2 fw-bold">7.8</div>
                <div class="progress mt-2">
                  <div class="progress-bar bg-warning" style="width: 78%"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white fw-bold small">
            Tiến độ theo chương
          </div>
          <ul class="list-group list-group-flush small">
            <li
              class="list-group-item d-flex justify-content-between align-items-center"
            >
              Chương 1 — HTML5 <span class="badge text-bg-success">100%</span>
            </li>
            <li
              class="list-group-item d-flex justify-content-between align-items-center"
            >
              Chương 2 — JavaScript <span class="badge text-bg-info">83%</span>
            </li>
            <li
              class="list-group-item d-flex justify-content-between align-items-center"
            >
              Chương 3 — CSS3 <span class="badge text-bg-info">74%</span>
            </li>
            <li
              class="list-group-item d-flex justify-content-between align-items-center"
            >
              Chương 4 — Bootstrap 5
              <span class="badge text-bg-secondary">45%</span>
            </li>
          </ul>
        </div>
      </main>
    </div>
  </body>
</html>
